[project]
name = "langchain-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "black>=26.5.1",
    "ipython>=9.16.1",
    "isort>=8.0.1",
    "langchain>=1.3.15",
    "langchain-google-genai>=4.3.4",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.5.1",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
]

[project.scripts]
langchain-project = "langchain_project:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
